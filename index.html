<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Autopilot Social: a social media bot that writes, schedules and posts content, grows your audience and clips streams.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Autopilot Social</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: control-room app — fixed rail of sections on the left, one working pane; rail becomes a scrolling tab strip on phones */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#E3E9E6; --line:#D2DBD7; --ink:#111816; --muted:#5A6863;
  --accent:#0B7A63; --accent-ink:#FFFFFF; --accent-soft:#D5EEE7; --live:#C77700; --live-soft:#FFEFD2;
  --good:#1C8A4A; --warn:#B26A00; --bad:#C2352B; --bad-soft:#FBE3E0;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1311; --surface:#151D1A; --sunk:#1C2622; --line:#2A3631; --ink:#E4EDE9; --muted:#93A39D;
  --accent:#3DCBA6; --accent-ink:#06231C; --accent-soft:#163A31; --live:#FFB84A; --live-soft:#3A2B10;
  --good:#4FD08A; --warn:#FFB84A; --bad:#FF7A6E; --bad-soft:#3B1C19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#151D1A; --sunk:#1C2622; --line:#2A3631; --ink:#E4EDE9; --muted:#93A39D;
  --accent:#3DCBA6; --accent-ink:#06231C; --accent-soft:#163A31; --live:#FFB84A; --live-soft:#3A2B10;
  --good:#4FD08A; --warn:#FFB84A; --bad:#FF7A6E; --bad-soft:#3B1C19; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;height:100dvh}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand b{font-family:var(--display);font-size:19px;font-weight:800;line-height:1}
.brand small{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:2px}
nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:500}
nav button:hover{background:var(--sunk);color:var(--ink)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
nav button:focus-visible{outline:2px solid var(--accent)}
nav svg{width:18px;height:18px;flex:none}
nav .count{margin-left:auto;font:500 11.5px var(--mono);color:var(--muted)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted)}
main{min-width:0;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:28px;font-weight:800}
.topbar p{margin:2px 0 0;color:var(--muted)}
.topbar .grow{flex:1;min-width:200px}
.pilot{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px}
.pilot .state{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.pilot .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
.pilot.on .dot{background:var(--live);box-shadow:0 0 0 4px var(--live-soft);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}
.switch{all:unset;cursor:pointer;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:17px;font-weight:700}
.panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head .sp{flex:1}
.sub{color:var(--muted);margin:0;font-size:13.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .k{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:700 28px var(--display);font-variant-numeric:tabular-nums;line-height:1.2}
.stat .n{font-size:12.5px;color:var(--muted)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:16px;height:16px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=time],input[type=datetime-local],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;color:var(--ink);font-weight:400;font-size:14px}
textarea{resize:vertical;min-height:80px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:150px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--sunk);font-size:12.5px;font-weight:500}
.chip button{all:unset;cursor:pointer;color:var(--muted);font-size:14px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font:600 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.draft{background:var(--sunk);color:var(--muted)}
.pill.approved{background:var(--accent-soft);color:var(--accent)}
.pill.posted{background:var(--accent);color:var(--accent-ink)}
.pill.blocked{background:var(--bad-soft);color:var(--bad)}
.pill.live{background:var(--live-soft);color:var(--live)}
.pill.ex{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.plat{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;font:700 11px var(--mono);color:#fff;flex:none}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0}
.item .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.item .text{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 0}
.item .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.log{font:12.5px/1.55 var(--mono);display:flex;flex-direction:column;gap:3px;max-height:320px;overflow:auto}
.log div{display:flex;gap:10px}
.log time{color:var(--muted);flex:none}
.log .ok{color:var(--good)} .log .warn{color:var(--warn)} .log .bad{color:var(--bad)}
.acct{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface)}
.acct.on{border-color:var(--accent)}
.acct-top{display:flex;align-items:center;gap:10px}
.acct-top b{font-family:var(--display);font-size:15.5px}
.acct-top .sp{flex:1}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:8px;background:var(--live-soft);color:var(--ink);font-size:13.5px}
.banner svg{flex:none;width:18px;height:18px;color:var(--live);margin-top:2px}
.banner.info{background:var(--accent-soft)}
.banner.info svg{color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.meter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.limit{display:grid;grid-template-columns:90px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.score{font:700 15px var(--mono);width:44px;text-align:center;padding:4px 0;border-radius:7px;background:var(--sunk);flex:none}
.score.hi{background:var(--accent-soft);color:var(--accent)}
.video-box{background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center}
.video-box video{width:100%;height:100%;display:block}
.video-box .ph{color:#9aa;font-size:13px;text-align:center;padding:20px}
.timeline{position:relative;height:38px;background:var(--sunk);border-radius:8px;overflow:hidden;cursor:pointer}
.timeline .seg-mark{position:absolute;top:0;bottom:0;background:var(--accent-soft);border-left:2px solid var(--accent);border-right:2px solid var(--accent)}
.timeline .clip-mark{position:absolute;top:26px;height:8px;background:var(--live);border-radius:3px;opacity:.75}
.timeline .head{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.style-card{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.style-card ul{margin:0;padding-left:18px}
.counter{font:12px var(--mono);color:var(--muted);text-align:right}
.counter.over{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:500;z-index:50;max-width:calc(100vw - 32px)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(5,10,8,.5)}
dialog .dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:500;color:var(--ink)}
.check input{width:16px;height:16px;accent-color:var(--accent)}
/* story studio */
.series{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-left:4px solid var(--gc,var(--accent));border-radius:var(--r);padding:14px;background:var(--surface)}
.series h3{font-size:17px}
.gpill{color:#fff}
.stage{background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:9/16;width:100%;max-width:330px;margin:0 auto}
.stage canvas{width:100%;height:100%;display:block}
.vgrid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:18px;align-items:start}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.scene{border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.scene .thumb{height:150px;background-size:cover;background-position:center;position:relative}
.scene .thumb b{position:absolute;left:6px;top:6px;font:600 11px var(--mono);background:rgba(0,0,0,.65);color:#fff;padding:1px 7px;border-radius:5px}
.scene .cap{padding:8px;display:flex;flex-direction:column;gap:6px}
.scene textarea{min-height:64px;font-size:12.5px;padding:6px 8px}
.scene select{padding:4px 6px;font-size:12.5px}
.reader{max-height:62vh;overflow:auto;white-space:pre-wrap;font-size:15.5px;line-height:1.75;padding-right:6px}
blockquote.epic{margin:0;padding:4px 12px;border-left:3px solid var(--live);font-style:italic}
details.thread summary,details.plan summary{cursor:pointer;color:var(--accent);font-size:12.5px;font-weight:600}
details.thread ol,details.plan ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;white-space:pre-wrap}
dialog.wide{width:min(760px,calc(100vw - 32px))}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.char{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:13px}
.char b{font-family:var(--display);font-size:15px}
@media (max-width:900px){
  .vgrid{grid-template-columns:minmax(0,1fr)}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{min-width:0;max-width:100vw}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding-block:10px;padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line);z-index:5;gap:12px}
  .brand small,.rail-foot{display:none}
  nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;min-width:0}
  nav button{white-space:nowrap;padding:7px 10px}
  nav .count{display:none}
  .grid2{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .grid3{grid-template-columns:1fr}
  .brand b{display:none}
  .topbar h1{font-size:23px}
  .item{flex-wrap:wrap}
  .item .acts{width:100%;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 L12 4 L20 18"/><path d="M8 13h8"/></svg></div>
      <div><b>Autopilot</b><small>Social growth bot</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------------- constants ---------------- */
const PLATFORMS = {
  instagram:{name:"Instagram",abbr:"IG",color:"#C13584",limit:2200},
  tiktok:{name:"TikTok",abbr:"TT",color:"#111111",limit:2200},
  x:{name:"X",abbr:"X",color:"#2B2B2B",limit:280},
  facebook:{name:"Facebook",abbr:"FB",color:"#1767D8",limit:5000},
  linkedin:{name:"LinkedIn",abbr:"in",color:"#0A66C2",limit:3000},
  youtube:{name:"YouTube Shorts",abbr:"YT",color:"#D62A1E",limit:5000},
  threads:{name:"Threads",abbr:"@",color:"#3A3A3A",limit:500},
  pinterest:{name:"Pinterest",abbr:"P",color:"#BD081C",limit:500},
  snapchat:{name:"Snapchat",abbr:"SC",color:"#B8A400",limit:250},
  telegram:{name:"Telegram",abbr:"TG",color:"#229ED9",limit:4096}
};
const SAFE = {follow:50, like:150, comment:25, dm:10}; // conservative per-day caps
const VIEWS = [
  ["overview","Overview",'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 9h8V3h-8z"/>'],
  ["accounts","Accounts",'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 11h5M19.5 8.5v5"/>'],
  ["autopilot","Autopilot brief",'<path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4"/><circle cx="12" cy="12" r="3"/>'],
  ["queue","Post queue",'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>'],
  ["stories","Story studio",'<path d="M2 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h8z"/>'],
  ["inspire","Style inspiration",'<path d="M12 3l2.6 5.6L20 9.3l-4 4 1 5.7-5-2.8-5 2.8 1-5.7-4-4 5.4-.7z"/>'],
  ["growth","Growth",'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>'],
  ["clips","Clip studio",'<rect x="2" y="5" width="15" height="14" rx="2"/><path d="M17 10l5-3v10l-5-3"/>']
];
const ICON = {
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};

/* ---------------- story studio constants ---------------- */
// pal = [background, mid tone, accent]; fx = animated overlay in videos; bed = soundtrack style
const GENRES = {
  thriller:{name:"Thriller",pal:["#0b0d12","#3a1518","#e04b3c"],fx:"rain",bed:"tense"},
  horror:{name:"Horror",pal:["#050506","#2a0c10","#c0182f"],fx:"fog",bed:"dark"},
  romance:{name:"Romance",pal:["#1a0b14","#6b2147","#ff8fb1"],fx:"bokeh",bed:"warm"},
  fantasy:{name:"Fantasy",pal:["#0b0a1c","#2c2160","#f2c14e"],fx:"sparks",bed:"epic"},
  scifi:{name:"Sci-fi",pal:["#03080f","#0d2c45","#39d0ff"],fx:"stars",bed:"synth"},
  mystery:{name:"Mystery",pal:["#0a0d0e","#1f3236","#9fd4c9"],fx:"fog",bed:"mystery"},
  drama:{name:"Drama",pal:["#0f0d0c","#3b2a22","#f0b37e"],fx:"bokeh",bed:"warm"},
  action:{name:"Action",pal:["#0c0a08","#3d2208","#ff9a1f"],fx:"sparks",bed:"pulse"},
  folklore:{name:"African folklore",pal:["#0c0904","#3a2a0c","#e8b04b"],fx:"embers",bed:"drums"},

function templatePost(platform, i, brief, style){
  const topics=(brief.topics&&brief.topics.length)?brief.topics:[brief.niche||"your niche"];
  const t=topics[i%topics.length];
  let text=HOOKS[(i*3+platform.length)%HOOKS.length].replace("{t}",t.toLowerCase())+"\n\n"+BODIES[(i+platform.length)%BODIES.length];
  const cta=splitList((brief.ctas||"").replace(/·/g,","))[i%Math.max(1,splitList((brief.ctas||"").replace(/·/g,",")).length)];
  if(cta && platform!=="x") text+="\n\n"+cta;
  const tags=t.split(/\s+/).filter(w=>w.length>3).slice(0,2).map(w=>"#"+w.replace(/[^\w]/g,""));
  if(text.length>P(platform).limit) text=text.slice(0,P(platform).limit-1)+"…";
  return {text, hashtags:tags.filter(x=>x.length>1)};
}

function openSlots(daysAhead){
  const slots=[]; const taken=new Set(S.posts.filter(p=>p.status!=="posted"||p.when>now()-6e4).map(p=>p.platform+"|"+p.when));
  const storyOnly=new Set(S.stories&&S.stories.settings.exclusive? S.stories.series.filter(s=>s.status==="active").flatMap(s=>s.platforms):[]);
  for(let d=0; d<daysAhead; d++){
    connected().filter(k=>!storyOnly.has(k)).forEach(k=>{
      const a=S.accounts[k]; (a.times||[]).slice(0,a.perDay||1).forEach(tm=>{
        const w=at(d,tm); if(w>now()+60e3 && !taken.has(k+"|"+w)) slots.push({platform:k,when:w});
      });
    });
  }
  return slots.sort((a,b)=>a.when-b.when);
}

async function generateForSlots(slots, opts={}){
  if(!slots.length) return {made:0,ai:false};
  slots=slots.slice(0,12);
  const style=opts.style;
  let results=null, usedAi=false, err=null;
  if(opts.allowAi!==false){
    try{
      const prompt=`You are the content engine of a social media autopilot. Write ${slots.length} ORIGINAL posts, one per slot below, for this account.

${briefText(S.brief)}
${style?`\nWrite in this creator-inspired style (match structure, rhythm, hooks and format, but never copy their sentences, ideas verbatim, or claim their experiences):\n${JSON.stringify(style.profile)}\n`:""}
${opts.extra?`\nExtra instruction for this batch: ${opts.extra}\n`:""}
Slots (keep this order; respect each platform's character limit; vary hooks and formats; no two posts alike):
${slots.map((s,i)=>`${i+1}. ${P(s.platform).name} (max ${P(s.platform).limit} chars incl. hashtags) — ${new Date(s.when).toLocaleString()}`).join("\n")}

Recent posts to avoid repeating:
${S.posts.slice(-8).map(p=>"- "+p.text.slice(0,90).replace(/\n/g," ")).join("\n")||"none"}

Reply with only a JSON array of ${slots.length} objects: [{"text":"post body without hashtags","hashtags":["#tag"]}]`;
      results=await ai(prompt,"default"); usedAi=Array.isArray(results);
      if(!usedAi) results=null;
    }catch(e){ err=e; results=null; }
  }
  let made=0;
  slots.forEach((s,i)=>{
    let r=results&&results[i]&&typeof results[i].text==="string"? results[i] : templatePost(s.platform, S.posts.length+i, S.brief, style);
    const tags=(Array.isArray(r.hashtags)?r.hashtags:[]).map(String).slice(0,6);
    S.posts.push({id:uid(),platform:s.platform,when:s.when,text:String(r.text).trim(),hashtags:tags,
      status:S.approval?"draft":"approved",source:style?"inspiration":"autopilot",styleId:style?style.id:null});
    made++;
  });
  return {made, ai:usedAi, err};
}

function score(t){
  const c=S.growth.criteria; let s=0; const bio=(t.bio||"").toLowerCase();
  const kws=splitList(c.keywords).map(x=>x.toLowerCase()); const ex=splitList(c.excludes).map(x=>x.toLowerCase());
  if(ex.some(e=>bio.includes(e)||t.handle.toLowerCase().includes(e))) return 0;
  const hits=kws.filter(k=>bio.includes(k)).length; s+=Math.min(50,hits*20);
  const f=Number(t.followers);
  if(isFinite(f)&&f>=Number(c.minF)&&f<=Number(c.maxF)) s+=20; else if(isFinite(f)) s-=10;
  if(Number(t.lastActive)<=Number(c.activeDays)) s+=15; else s-=15;

  if(!locs.length || locs.some(l=>(t.location||"").toLowerCase().includes(l)||bio.includes(l))) s+=15;
  if(c.requireBio && !bio) s-=30;
  return Math.max(0,Math.min(100,s));

  let changed=false;
  if(!S.autopilot){ return; }
  // 1) publish due posts
  S.posts.forEach(p=>{
    if(p.when<=now() && (p.status==="approved" || (!S.approval && p.status==="draft"))){
      const acc=S.accounts[p.platform];
      if(!acc||!acc.connected){ p.status="blocked"; p.note="Account not linked"; log(`Skipped ${P(p.platform).name} post — account not linked.`,"warn"); }
      else{ p.status="posted"; p.postedAt=now(); log(`Posted to ${P(p.platform).name} @${acc.handle}${acc.demo?" (demo)":""}${p.thread&&p.thread.length>1?` (${p.thread.length}-post ${p.format==="long"?"series":"thread"})`:""}: "${p.text.slice(0,60).replace(/\n/g," ")}…"`,"ok"); }
      changed=true;
    }
  });
  // 2) growth actions, spaced at least 45s apart, within daily limits
  resetDailyIfNeeded();
  if(now()-lastGrowthAct>45e3){
    const g=S.growth; const min=55;
    const next=g.targets.find(t=>t.status==="queued");
    if(next){
      const sc=score(next);
      if(sc<min){ next.status="skipped"; log(`Skipped @${next.handle} — match score ${sc} is below ${min}.`,"warn"); changed=true; }
      else{
        const acts=[]; if(g.used.follow<g.limits.follow){g.used.follow++;acts.push("followed");}
        if(g.used.like<g.limits.like){ const n=Math.min(2,g.limits.like-g.used.like); g.used.like+=n; acts.push(`liked ${n} posts`); }
        if(g.used.comment<g.limits.comment && sc>=75){ g.used.comment++; acts.push("left a comment"); }
        if(acts.length){ next.status="done"; next.doneAt=now(); log(`Engaged @${next.handle} on ${P(next.platform).name}: ${acts.join(", ")}.`,"ok"); changed=true; }
      }
      lastGrowthAct=now();
    }
  }
  // 3) keep the queue full (templates, or AI if already allowed this session)
  if(now()-S.lastRefill>15*60e3){
    S.lastRefill=now();
    const slots=openSlots(Number(S.brief.days)||3);
    if(slots.length){
      generateForSlots(slots,{allowAi:!!tmp.aiOk}).then(r=>{ if(r.made){ log(`Refilled the queue with ${r.made} new ${S.approval?"drafts to review":"posts"}.`,"ok"); save(); render(); } });
    }
    changed=true;
  }
  // 4) clip schedule publishing is handled through posts
  // 5) story series: schedule written parts, write the next ones, start new series
  if(tickStories()) changed=true;
  if(changed){ save(); render(); }
}

/* ---------------- video ---------------- */
function mountVideo(){
  const v=tmp.video, box=$("#vbox"); if(!v||!box) return;
  if(!v.el){ v.el=document.createElement("video"); v.el.controls=true; v.el.playsInline=true; v.el.src=v.url;
    v.el.addEventListener("timeupdate",drawTimeline); v.el.addEventListener("loadedmetadata",drawTimeline); }
  box.innerHTML=""; box.appendChild(v.el);
  const tl=$("#tl"); if(tl) tl.onclick=e=>{ const r=tl.getBoundingClientRect(); if(v.el.duration) v.el.currentTime=(e.clientX-r.left)/r.width*v.el.duration; };
  drawTimeline();
}
function drawTimeline(){
  const v=tmp.video, tl=$("#tl"); if(!v||!tl||!v.el.duration) return;
  const d=v.el.duration, pct=x=>(x/d*100)+"%";
  let h="";
  S.clips.items.filter(i=>i.file===v.name).forEach(i=>{ h+=`<div class="clip-mark" style="left:${pct(i.start)};width:${pct(i.end-i.start)}"></div>`; });
  const a=tmp.mark.in, b=tmp.mark.out;
  if(a!=null){ const e=b!=null&&b>a?b:v.el.currentTime; if(e>a) h+=`<div class="seg-mark" style="left:${pct(a)};width:${pct(e-a)}"></div>`; }
  h+=`<div class="head" style="left:${pct(v.el.currentTime)}"></div>`;
  tl.innerHTML=h; const tc=$("#tc"); if(tc) tc.textContent=secs(v.el.currentTime)+" / "+secs(d);
}
async function renderClip(it){
  const v=tmp.video; if(!v||!v.el.captureStream&&!v.el.mozCaptureStream){ toast("This browser can't export video. Try Chrome or Edge."); return; }
  tmp.busy["r_"+it.id]=true; render();
  try{
    const el=v.el; el.currentTime=it.start; await new Promise(r=>el.addEventListener("seeked",r,{once:true}));
    const stream=(el.captureStream||el.mozCaptureStream).call(el);
    const type=["video/webm;codecs=vp9,opus","video/webm"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
    const rec=new MediaRecorder(stream,type?{mimeType:type}:undefined); const chunks=[];
    rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    const done=new Promise(r=>rec.onstop=r);
    rec.start(); await el.play();
    await new Promise(r=>{ const chk=()=>{ if(el.currentTime>=it.end||el.ended){ r(); } else requestAnimationFrame(chk); }; chk(); });
    el.pause(); rec.stop(); await done;
    const blob=new Blob(chunks,{type:"video/webm"});
    const dl=window.claude? await claude.use("downloads").catch(()=>null):null;
    const name=(it.title||"clip").replace(/[^\w-]+/g,"-").slice(0,40)+".webm";
    if(dl){ try{ await dl.save({filename:name,data:blob}); log(`Exported clip "${it.title}".`,"ok"); }catch(e){ toast("Export cancelled."); } }
    else { const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); log(`Exported clip "${it.title}".`,"ok"); }
  }catch(e){ console.warn(e); toast("Couldn't render that clip. Try a shorter section or another browser."); }
  tmp.busy["r_"+it.id]=false; save(); render();
}

function dialog(html, onSubmit, wide){

  const f=$("#dlgBody form"); if(f) f.onsubmit=e=>{ e.preventDefault(); const fd=Object.fromEntries(new FormData(f)); if(onSubmit(fd)!==false){ d.close(); } };
  $("#dlgBody").querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>d.close());
  const first=$("#dlgBody input:not([type=checkbox]), #dlgBody textarea"); if(first&&!wide) first.focus();
}

async function fill(extra){
  const slots=openSlots(Number(S.brief.days)||3);
  if(!connected().length){ toast("Link at least one account first."); view="accounts"; render(); return; }
  if(!slots.length){ toast("Every slot is already filled. Add posting times or plan more days ahead."); return; }
  tmp.busy.fill=true; render();
  let total=0, usedAi=false, err=null;
  for(let i=0;i<slots.length;i+=12){ const r=await generateForSlots(slots.slice(i,i+12),{extra}); total+=r.made; usedAi=usedAi||r.ai; err=err||r.err; if(r.err) break; }
  if(err && total<slots.length){ const rest=slots.slice(total); const r=await generateForSlots(rest,{allowAi:false}); total+=r.made; }
  tmp.busy.fill=false;
  log(`Wrote ${total} posts${usedAi?" with AI":" from templates"}.`, usedAi?"ok":"warn");
  if(err) toast(aiErrMsg(err)); else toast(`${total} posts added${S.approval?" for review":""}.`);
  S.lastRefill=now(); save(); render();
}

/* ================= STORY STUDIO: engine ================= */
const G=k=>GENRES[k]||GENRES.thriller;
const clip=(s,n)=>{ s=String(s||"").trim(); if(s.length<=n) return s; const cut=s.slice(0,n-1); const sp=cut.lastIndexOf(" "); return (sp>n*0.6?cut.slice(0,sp):cut)+"…"; };
const slug=t=>String(t||"story").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"story";
const wordCount=t=>(String(t||"").match(/\S+/g)||[]).length;
function hash(str){ let h=2166136261; for(const c of String(str)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function rand(seed){ let x=(seed>>>0)||1; return ()=>{ x^=x<<13; x>>>=0; x^=x>>>17; x^=x<<5; x>>>=0; return (x%100000)/100000; }; }
const maxN=s=>s.chapters.reduce((m,c)=>Math.max(m,c.n),0);
const chPosts=(s,n)=>S.posts.filter(p=>p.seriesId===s.id&&p.chapter===n);
function chStatus(s,ch){ const ps=chPosts(s,ch.n); if(ps.some(p=>p.status==="posted")) return "posted"; if(ps.length) return "scheduled"; return "written"; }
const postedCount=s=>s.chapters.filter(c=>chStatus(s,c)==="posted").length;
function sentences(t){ return (String(t||"").replace(/\s+/g," ").match(/[^.!?…]+[.!?…]+["”’)]*\s*|[^.!?…]+$/g)||[]).map(x=>x.trim()).filter(Boolean); }
// Pack paragraphs into chunks no longer than lim, splitting long paragraphs at sentence ends
function packText(paras, lim){
  const out=[]; let cur="";
  const push=x=>{ const sep=cur?"\n\n":""; if((cur+sep+x).length<=lim) cur+=sep+x; else { if(cur) out.push(cur); cur=x.length<=lim?x:clip(x,lim); } };
  paras.map(p=>p.trim()).filter(Boolean).forEach(p=>{
    if(p.length<=lim){ push(p); return; }
    let line=""; sentences(p).forEach(se=>{ if((line?line+" ":"").length+se.length<=lim) line=line?line+" "+se:se; else { if(line) push(line); line=se.length<=lim?se:clip(se,lim); } });
    if(line) push(line);
  });
  if(cur) out.push(cur);
  return out;
}

/* ---- normalising AI output ---- */
function normalizeBible(b,s){
  b=b&&typeof b==="object"?b:{};

  return {
    title:clip(b.title||"Untitled Story",60), logline:String(b.logline||""), hook:String(b.hook||""), world:String(b.world||""),
    characters:(Array.isArray(b.characters)?b.characters:[]).slice(0,8).map(c=>({name:String(c.name||"Someone"),role:String(c.role||""),look:String(c.look||""),want:String(c.want||""),secret:String(c.secret||"")})),
    arc:Array.from({length:s.total},(_,i)=>{ const a=arc.find(x=>Number(x.n)===i+1)||arc[i]||{}; return {n:i+1,title:String(a.title||`Part ${i+1}`),beat:String(a.beat||"The stakes rise and a new secret comes out.")}; }),
    hashtags:(Array.isArray(b.hashtags)?b.hashtags:[]).map(x=>"#"+String(x).replace(/^#/,"").replace(/\s+/g,"")).filter(x=>x.length>1).slice(0,6)

function autoScenes(s,ch){
  const paras=ch.text.split(/\n\s*\n/).filter(p=>p.trim().length>20);

  const chosen=paras.filter((_,i)=>i%pick===0).slice(0,7);
  const fx=["rain","heartbeat","stinger","whoosh","bell","impact","thunder"];
  return chosen.map((p,i)=>({onScreen:clip(sentences(p)[0]||p,110),image:`${s.setting||""} ${clip(p,220)}`.trim(),mood:"tense",sfx:i===chosen.length-1?"thunder":fx[i%fx.length]}));
}
function autoThread(s,ch){
  const body=packText(ch.text.split(/\n\s*\n/),265).slice(0,22);
  return [`📖 ${s.title}: Part ${ch.n}, ${ch.title} 🧵\n\n${clip(ch.epicLine||s.hook||"",170)}`, ...body,
    ch.n<s.total?`${clip(ch.cliffhanger,180)}\n\nPart ${ch.n+1} drops tomorrow. 🔔 Follow so you don't miss it.`:`The End. Thank you for reading. 🙏\nA new story starts soon, so follow for it.`];
}
function adaptChapter(s,ch,r){
  r=r&&typeof r==="object"?r:{};
  let scenes=(Array.isArray(r.scenes)?r.scenes:[]).filter(x=>x&&x.onScreen).slice(0,10).map(x=>({onScreen:clip(x.onScreen,130),image:String(x.image||x.onScreen),mood:MOODS.includes(x.mood)?x.mood:"tense",sfx:SFX.includes(x.sfx)?x.sfx:"none"}));
  if(scenes.length<3) scenes=autoScenes(s,ch);
  let thread=(Array.isArray(r.thread)?r.thread:[]).map(x=>clip(String(x),280)).filter(Boolean);
  if(thread.length<3) thread=autoThread(s,ch);
  ch.scenes=scenes; ch.thread=thread;
  ch.captionShort=clip(r.captionShort||ch.cliffhanger||s.hook,150);
  ch.captionLong=clip(r.captionLong||`${s.logline}\n\n${ch.cliffhanger}`,600);
  if(Array.isArray(r.hashtags)&&r.hashtags.length) ch.hashtags=r.hashtags.map(x=>"#"+String(x).replace(/^#/,"").replace(/\s+/g,"")).slice(0,6);
  return ch;
}

function templateBible(s){

function templateChapter(s,n){

async function writeNext(s,auto){
  const key="sw_"+s.id;
  if(tmp.busy[key]) return false;
  const n=maxN(s)+1; if(n>s.total) return false;
  tmp.busy[key]=n; render();
  let ch=null;
  try{
    if(s.engine==="template") ch=templateChapter(s,n);
    else{
      try{ ch=await aiChapter(s,n); }
      catch(e){
        if(auto){ s.retryAt=now()+10*60e3; log(`Couldn't write ${s.title} Part ${n} yet (AI unavailable). Retrying in 10 minutes.`,"warn"); }
        else { toast(e&&e.code==="bad_reply"?"The AI reply was incomplete. Try again.":aiErrMsg(e)); }
      }
    }
    if(ch){
      ch.prevSoFar=s.storySoFar||"";
      if(ch.storySoFar) s.storySoFar=ch.storySoFar; delete ch.storySoFar;
      s.chapters=s.chapters.filter(c=>c.n!==n).concat(ch).sort((a,b)=>a.n-b.n);
      log(`Wrote ${s.title} Part ${n}: “${ch.title}” (${wordCount(ch.text).toLocaleString()} words${ch.engine==="template"?", template":""}).`,"ok");
      scheduleSeries(s);
    }

  return !!ch;

async function createSeries(d, auto){
  if(tmp.busy.ns) return null;
  tmp.busy.ns=true; render();
  const st=S.stories.settings;
  let genre=d.genre;
  if(genre==="rotate"){ const list=st.rotate.length?st.rotate:Object.keys(GENRES); genre=list[(st.rotIdx||0)%list.length]; st.rotIdx=((st.rotIdx||0)+1)%list.length; }
  const s={id:"ser_"+uid(),genre,setting:d.setting||"",premise:d.idea||"",total:Number(d.total)||20,length:d.length||"long",rating:d.rating||"teen",language:d.language||"English",
    platforms:d.platforms.slice(),times:d.times.slice(),perDay:Number(d.perDay)||1,status:"active",chapters:[],scheduled:0,storySoFar:"",createdAt:now(),engine:"ai"};
  let b=null;
  if(!auto||aiReady()){
    try{ b=await ai(biblePrompt(s),"default",{maxTokens:Math.min(16000,3000+s.total*120)}); if(!b||!b.title||!Array.isArray(b.arc)) b=null; }
    catch(e){ if(!auto) toast(aiErrMsg(e)); }
  }
  if(!b){ if(auto){ tmp.busy.ns=false; log("Couldn't start the next story series because AI isn't available. Start one from Story studio.","warn"); return null; } s.engine="template"; b=templateBible(s); }
  Object.assign(s,normalizeBible(b,s));
  if(!s.hashtags.length) s.hashtags=["#StoryTime","#"+G(genre).name.replace(/\W/g,"")];
  S.stories.series.unshift(s);
  log(`Started a new ${G(genre).name} series “${s.title}”: ${s.total} parts on ${s.platforms.map(k=>P(k).name).join(", ")}.`,"ok");
  tmp.busy.ns=false; save(); render();
  await writeNext(s,auto);
  return s;
}

function chapterPost(s,ch,k){
  const lim=P(k).limit; const tags=(ch.hashtags&&ch.hashtags.length?ch.hashtags:s.hashtags||[]).slice(0,k==="x"||k==="threads"?0:5);
  const room=lim-(tags.join(" ").length+1);
  const head=`📖 ${s.title}: Part ${ch.n}${ch.n===s.total?" (Finale)":""}, ${ch.title}`;
  const next=ch.n<s.total?`Part ${ch.n+1} drops tomorrow. Follow so you don't miss it 🔔`:"The End. A new story starts soon, so follow for it.";
  if(k==="x"||k==="threads"){
    let th=(ch.thread&&ch.thread.length?ch.thread:autoThread(s,ch)).slice();
    th=k==="threads"?packText(th,lim):th.map(x=>clip(x,lim));
    return {text:th[0],thread:th,format:"thread",tags};
  }
  if(VIDEO_PLATS.includes(k)){
    const cap=k==="instagram"?`${head}\n\n${ch.captionLong}\n\n${next}`:`${ch.captionShort} (Part ${ch.n})`;
    return {text:clip(cap,room),format:"video",tags,note:"Export this part's video in Story studio and attach it. Turn on the platform's AI-generated content label."};
  }
  if(k==="pinterest") return {text:clip(`${head}\n\n“${ch.epicLine}”\n\n${s.hook}`,room),format:"teaser",tags};
  const chunks=packText(`${head}\n\n${ch.text}\n\n${ch.n<s.total?"To be continued…\n\n":""}${next}`.split(/\n\s*\n/),room-12);
  if(chunks.length===1) return {text:chunks[0],format:"long",tags};
  const marked=chunks.map((c,i)=>`${c}\n\n(${i+1}/${chunks.length})`);
  return {text:marked[0],thread:marked,format:"long",tags,note:`Long part: posts 2–${chunks.length} go out as follow-up comments or replies.`};
}
function scheduleSeries(s){
  if(s.status!=="active") return false;
  const plats=s.platforms.filter(k=>S.accounts[k]&&S.accounts[k].connected); if(!plats.length) return false;
  const used=new Set(S.posts.filter(p=>p.seriesId===s.id).map(p=>p.when));
  const days=Math.max(3,Number(S.brief.days)||3); let changed=false;
  for(let d=0; d<days; d++) for(const tm of s.times.slice(0,s.perDay)){
    const w=at(d,tm); if(w<=now()+60e3||used.has(w)) continue;
    const n=(s.scheduled||0)+1; if(n>s.total) return changed;
    const ch=s.chapters.find(c=>c.n===n); if(!ch) return changed;
    plats.forEach(k=>{ const a=chapterPost(s,ch,k);
      S.posts.push({id:uid(),platform:k,when:w,text:a.text,thread:a.thread&&a.thread.length>1?a.thread:null,format:a.format,hashtags:a.tags||[],
        status:S.approval?"draft":"approved",source:"story",seriesId:s.id,chapter:n,note:a.note||""}); });
    s.scheduled=n; used.add(w); changed=true;
  }
  return changed;
}
function unscheduleSeries(s){
  S.posts=S.posts.filter(p=>!(p.seriesId===s.id&&p.status!=="posted"));
  s.scheduled=s.chapters.filter(c=>chStatus(s,c)==="posted").reduce((m,c)=>Math.max(m,c.n),0);
}
function refreshChapterPosts(s,ch){
  chPosts(s,ch.n).filter(p=>p.status!=="posted").forEach(p=>{ const a=chapterPost(s,ch,p.platform); p.text=a.text; p.thread=a.thread&&a.thread.length>1?a.thread:null; p.hashtags=a.tags||[]; p.format=a.format; p.note=a.note||""; });
}
function tickStories(){
  const st=S.stories; let changed=false;
  st.series.forEach(s=>{ if(scheduleSeries(s)) changed=true; });
  // finished series → mark done, maybe start the next genre
  st.series.filter(s=>s.status==="active"&&s.scheduled>=s.total&&maxN(s)>=s.total).forEach(s=>{
    if(S.posts.some(p=>p.seriesId===s.id&&p.status!=="posted")) return;
    s.status="done"; changed=true; log(`Finished “${s.title}”: all ${s.total} parts posted.`,"ok");
    if(st.autoNew && !st.series.some(x=>x.status==="active"&&x.id!==s.id&&x.platforms.some(k=>s.platforms.includes(k)))) tmp.pendingNew=s;
  });
  if(tmp.storyWriting||tmp.busy.ns) return changed;
  if(tmp.pendingNew && aiReady()){
    const old=tmp.pendingNew; tmp.pendingNew=null; tmp.storyWriting=true;
    createSeries({genre:"rotate",setting:old.setting,total:old.total,length:old.length,rating:old.rating,language:old.language,platforms:old.platforms,times:old.times,perDay:old.perDay},true)
      .finally(()=>{ tmp.storyWriting=false; });
    return changed;
  }
  const need=st.series.find(s=>s.status==="active"&&maxN(s)<s.total&&(maxN(s)-(s.scheduled||0))<(Number(st.ahead)||1)&&!(s.retryAt>now())&&(s.engine==="template"||aiReady()));
  if(need){ tmp.storyWriting=true; writeNext(need,true).finally(()=>{ tmp.storyWriting=false; }); }
  return changed;
}

/* ================= STORY STUDIO: video maker ================= */
const VW=720, VH=1280;
const FONT_D='"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif';
const FONT_B='"IBM Plex Sans", "Segoe UI", system-ui, sans-serif';
const FONT_M='"IBM Plex Mono", ui-monospace, Menlo, monospace';
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }

/* ---- pictures ---- */
tmp.imgCache={};
const imgKey=(s,ch,i)=>`${s.id}|${ch.n}|${i}`;
function imgPrompt(s,sc){
  const who=(s.characters||[]).filter(c=>c.look&&sc.image.includes(c.name)).map(c=>`${c.name} is ${c.look}`).join(". ");
  return `${sc.image}. ${who}. Setting: ${s.setting||""}. Cinematic digital painting, ${G(s.genre).name.toLowerCase()} atmosphere, ${sc.mood||""} mood, dramatic lighting, rich detail, vertical composition, no text, no letters, no watermark`.slice(0,1100);
}
function loadImg(src,timeout){
  return new Promise(res=>{ const im=new Image(); let done=false; const fin=v=>{ if(!done){ done=true; res(v); } };
    im.crossOrigin="anonymous"; im.onload=()=>fin(im.naturalWidth?im:null); im.onerror=()=>fin(null); im.src=src; setTimeout(()=>fin(null),timeout||70000); });
}
async function sceneImage(s,ch,i){
  const key=imgKey(s,ch,i); const c=tmp.imgCache[key];
  if(c&&(c.img||c.failed)) return c.img||null;
  if(S.stories.settings.images==="mood") return null;
  const sc=ch.scenes[i]; const p=encodeURIComponent(imgPrompt(s,sc)); const seed=hash(key)%999999;
  let im=await loadImg(`api/image?prompt=${p}&seed=${seed}`);
  if(!im) im=await loadImg(`https://image.pollinations.ai/prompt/${p}?width=720&height=1280&seed=${seed}&nologo=true&model=flux`);
  tmp.imgCache[key]=im?{img:im}:{failed:true};

}
async function loadChapterImages(s,ch,onProgress){
  const out=new Array(ch.scenes.length).fill(null); let done=0, i=0;
  const worker=async()=>{ while(i<ch.scenes.length){ const k=i++; out[k]=await sceneImage(s,ch,k); done++; onProgress&&onProgress(done,ch.scenes.length); } };
  await Promise.all([worker(),worker(),worker()]);
  return out;
}

/* ---- drawing ---- */
function videoPlan(s,ch){
  const segs=[{kind:"title",dur:3.2}];
  ch.scenes.forEach((sc,i)=>segs.push({kind:"scene",i,sc,dur:Math.max(3.6,Math.min(8.5,2.4+sc.onScreen.length/12))}));
  segs.push({kind:"end",dur:4});
  let t=0; segs.forEach(g=>{ g.t0=t; t+=g.dur; });
  return {segs,total:t};
}
function wrapLines(ctx,text,maxW){
  const out=[]; String(text).split("\n").forEach(par=>{ let line=""; par.split(/\s+/).filter(Boolean).forEach(w=>{ const tst=line?line+" "+w:w; if(ctx.measureText(tst).width>maxW&&line){ out.push(line); line=w; } else line=tst; }); out.push(line); });
  return out;
}
function textBlock(ctx,text,o){
  ctx.save(); ctx.font=`${o.weight||800} ${o.size}px ${o.font||FONT_D}`; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle=o.color||"#fff"; ctx.shadowColor="rgba(0,0,0,.85)"; ctx.shadowBlur=o.blur==null?22:o.blur;
  if(o.spacing) try{ ctx.letterSpacing=o.spacing+"px"; }catch(e){}
  const lines=wrapLines(ctx,text,o.maxW||VW-120); const lh=o.size*(o.lh||1.2);
  let left=o.shown==null?Infinity:o.shown; const y0=o.y-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>{ if(left<=0) return; const part=left>=l.length?l:l.slice(0,left); left-=l.length+1; ctx.fillText(part,VW/2,y0+i*lh); });
  ctx.restore(); return lines.length*lh;
}
function drawCover(ctx,img,zoom,px,py){
  const r=Math.max(VW/img.naturalWidth,VH/img.naturalHeight)*zoom; const w=img.naturalWidth*r, h=img.naturalHeight*r;
  ctx.drawImage(img,(VW-w)/2+px*(w-VW)/2,(VH-h)/2+py*(h-VH)/2,w,h);
}
function drawBg(ctx,img,g,seed,p){
  const r=rand(seed);
  if(img){ const dir=r()>.5?1:-1; drawCover(ctx,img,1.06+0.12*p,dir*(p-.5)*0.9,(r()-.5)*0.5); return; }
  const [a,b,c]=g.pal;
  const gr=ctx.createLinearGradient(0,0,0,VH); gr.addColorStop(0,a); gr.addColorStop(.55,b); gr.addColorStop(1,a); ctx.fillStyle=gr; ctx.fillRect(0,0,VW,VH);
  const cx=VW*(.2+.6*r())+Math.sin(p*3+seed)*50, cy=VH*(.22+.3*r());
  const rg=ctx.createRadialGradient(cx,cy,0,cx,cy,560); rg.addColorStop(0,hexA(c,.45)); rg.addColorStop(1,hexA(c,0)); ctx.fillStyle=rg; ctx.fillRect(0,0,VW,VH);
  ctx.fillStyle=a; ctx.beginPath(); ctx.moveTo(0,VH);
  for(let x=0;x<=VW;x+=24){ ctx.lineTo(x,VH*(.72+.04*Math.sin(x*.011+seed%11)+.025*Math.sin(x*.05+seed%5))); }
  ctx.lineTo(VW,VH); ctx.fill();
}
function drawFx(ctx,g,t){
  ctx.save();
  if(g.fx==="rain"){ ctx.strokeStyle="rgba(200,220,255,.28)"; ctx.lineWidth=2; for(let i=0;i<90;i++){ const x=(i*97.3)%VW, sp=950+(i*37)%500, y=((t*sp+i*211)%(VH+200))-100; ctx.beginPath(); ctx.moveTo(x+y*.08,y); ctx.lineTo(x+y*.08+6,y+40); ctx.stroke(); } }
  else if(g.fx==="fog"){ for(let i=0;i<7;i++){ const x=((t*22*(i%2?1:-1)+i*260)%(VW+700)+VW+700)%(VW+700)-350, y=VH*(.3+.09*i); const rg=ctx.createRadialGradient(x,y,0,x,y,400); rg.addColorStop(0,"rgba(220,230,230,.11)"); rg.addColorStop(1,"rgba(220,230,230,0)"); ctx.fillStyle=rg; ctx.fillRect(x-400,y-400,800,800); } }
  else if(g.fx==="bokeh"){ for(let i=0;i<24;i++){ const x=(i*151)%VW+Math.sin(t*.5+i)*24, y=VH-((t*28+i*173)%(VH+120))+60, rr=10+(i*7)%32; ctx.fillStyle=hexA(g.pal[2],.05+((i*13)%10)/90); ctx.beginPath(); ctx.arc(x,y,rr,0,7); ctx.fill(); } }
  else if(g.fx==="sparks"||g.fx==="embers"){ for(let i=0;i<70;i++){ const x=(i*89)%VW+Math.sin(t*2+i)*16, y=VH-((t*(70+(i*29)%130)+i*97)%(VH+60)), z=1.5+(i%3); ctx.fillStyle=hexA(g.pal[2],.25+.55*Math.abs(Math.sin(t*3+i))); ctx.fillRect(x,y,z,z); } }
  else if(g.fx==="stars"){ for(let i=0;i<130;i++){ const x=(i*131)%VW, y=(i*277)%VH; ctx.fillStyle=`rgba(200,240,255,${.15+.6*Math.abs(Math.sin(t*1.4+i*1.7))})`; ctx.fillRect(x,y,2,2); } }
  ctx.restore();
}
function shade(ctx,top,bottom){
  const gr=ctx.createLinearGradient(0,0,0,VH);
  gr.addColorStop(0,`rgba(0,0,0,${top})`); gr.addColorStop(.28,"rgba(0,0,0,0)"); gr.addColorStop(.45,"rgba(0,0,0,0)"); gr.addColorStop(1,`rgba(0,0,0,${bottom})`);
  ctx.fillStyle=gr; ctx.fillRect(0,0,VW,VH);
}
function drawSeg(ctx,s,ch,seg,local,imgs,t){
  const g=G(s.genre), acc=g.pal[2], p=Math.min(1,local/seg.dur);
  const img=seg.kind==="title"?imgs[0]:seg.kind==="end"?imgs[imgs.length-1]:imgs[seg.i];
  drawBg(ctx,img,g,hash(s.id+seg.kind+(seg.i||0)),p); drawFx(ctx,g,t);
  if(seg.kind==="title"){
    ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(0,0,VW,VH);
    const a=Math.min(1,local/.6); ctx.globalAlpha=a;
    textBlock(ctx,g.name.toUpperCase(),{y:400,size:28,weight:600,font:FONT_M,color:acc,spacing:6,blur:0});
    textBlock(ctx,s.title,{y:540,size:s.title.length>14?78:96,lh:1.05});
    textBlock(ctx,ch.n===s.total?"FINALE":`PART ${ch.n}`,{y:700,size:46,weight:600,font:FONT_M,color:acc,spacing:4});
    textBlock(ctx,ch.title,{y:790,size:38,weight:500,font:FONT_B,maxW:VW-160});
    ctx.globalAlpha=1;
  } else if(seg.kind==="end"){
    shade(ctx,.5,.92); ctx.fillStyle="rgba(0,0,0,.35)"; ctx.fillRect(0,0,VW,VH);
    textBlock(ctx,ch.n<s.total?"To be continued…":"THE END",{y:470,size:66});
    if(ch.cliffhanger) textBlock(ctx,ch.cliffhanger,{y:680,size:36,weight:500,font:FONT_B,maxW:VW-140,lh:1.3});
    const pulse=1+.04*Math.sin(t*6);
    ctx.save(); ctx.translate(VW/2,980); ctx.scale(pulse,pulse); ctx.translate(-VW/2,-980);
    textBlock(ctx,ch.n<s.total?`Follow for Part ${ch.n+1} ▶`:"Follow for the next story ▶",{y:980,size:40,color:acc,blur:10});
    ctx.restore();
  } else {
    shade(ctx,.55,.9);
    textBlock(ctx,`${s.title} · ${ch.n===s.total?"Finale":"Part "+ch.n}`,{y:96,size:28,weight:600,font:FONT_B,color:"rgba(255,255,255,.85)",blur:8});
    const txt=seg.sc.onScreen; const size=txt.length<55?58:txt.length<85?50:44;
    const shown=Math.floor(txt.length*Math.min(1,local/Math.max(1.2,seg.dur*.45)));
    const h=textBlock(ctx,txt,{y:VH*.7,size,shown,maxW:VW-110});
    ctx.fillStyle=acc; ctx.fillRect(VW/2-40,VH*.7+h/2+28,80*Math.min(1,local/.8),5);
  }
}
function drawFrame(ctx,s,ch,plan,imgs,t){
  let i=plan.segs.findIndex(g=>t<g.t0+g.dur); if(i<0) i=plan.segs.length-1;
  const seg=plan.segs[i], local=t-seg.t0, XF=.45;
  ctx.clearRect(0,0,VW,VH);
  if(i>0&&local<XF){ const prev=plan.segs[i-1]; drawSeg(ctx,s,ch,prev,prev.dur,imgs,t); ctx.globalAlpha=local/XF; drawSeg(ctx,s,ch,seg,local,imgs,t); ctx.globalAlpha=1; }
  else drawSeg(ctx,s,ch,seg,local,imgs,t);
  ctx.fillStyle="rgba(255,255,255,.18)"; ctx.fillRect(0,0,VW,6);
  ctx.fillStyle=G(s.genre).pal[2]; ctx.fillRect(0,0,VW*Math.min(1,t/plan.total),6);
}

/* ---- sound: genre soundtrack + effects, all synthesised (no files needed) ---- */
const NOISE=new WeakMap();
function noiseBuf(ac){ if(NOISE.has(ac)) return NOISE.get(ac); const b=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; NOISE.set(ac,b); return b; }
function envG(ac,t,a,peak,d){ const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); return g; }
function osc(ac,type,f){ const o=ac.createOscillator(); o.type=type; o.frequency.value=f; return o; }
function noiseSrc(ac){ const n=ac.createBufferSource(); n.buffer=noiseBuf(ac); return n; }
function filt(ac,type,f,q){ const x=ac.createBiquadFilter(); x.type=type; x.frequency.value=f; if(q) x.Q.value=q; return x; }
const FX={
  impact(ac,out,t){ const o=osc(ac,"sine",110); o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(28,t+1.3); o.connect(envG(ac,t,.005,.9,1.5)).connect(out); o.start(t); o.stop(t+1.6);
    const n=noiseSrc(ac); n.connect(filt(ac,"lowpass",1200)).connect(envG(ac,t,.002,.45,.5)).connect(out); n.start(t); n.stop(t+.6); },
  whoosh(ac,out,t){ const n=noiseSrc(ac), f=filt(ac,"bandpass",250,2); f.frequency.setValueAtTime(250,t); f.frequency.exponentialRampToValueAtTime(3500,t+.6); f.frequency.exponentialRampToValueAtTime(300,t+1.3);
    n.connect(f).connect(envG(ac,t,.55,.55,.8)).connect(out); n.start(t); n.stop(t+1.4); },
  heartbeat(ac,out,t,dur){ const thump=(at,v)=>{ const o=osc(ac,"sine",70); o.frequency.setValueAtTime(72,at); o.frequency.exponentialRampToValueAtTime(38,at+.18); o.connect(envG(ac,at,.008,v,.22)).connect(out); o.start(at); o.stop(at+.3); };
    for(let k=0;k<dur-.3;k+=.82){ thump(t+k,.9); thump(t+k+.25,.55); } },
  thunder(ac,out,t){ const n=noiseSrc(ac), f=filt(ac,"lowpass",2200); f.frequency.setValueAtTime(2200,t); f.frequency.exponentialRampToValueAtTime(160,t+3.6);
    n.connect(f).connect(envG(ac,t,.03,.95,3.6)).connect(out); n.start(t); n.stop(t+3.9); FX.impact(ac,out,t+.05); },
  riser(ac,out,t,dur){ const d=Math.min(3,Math.max(1,dur)), st=t+Math.max(0,dur-d);
    const o=osc(ac,"sawtooth",180); o.frequency.setValueAtTime(180,st); o.frequency.exponentialRampToValueAtTime(1400,st+d);
    const f=filt(ac,"lowpass",400); f.frequency.setValueAtTime(400,st); f.frequency.exponentialRampToValueAtTime(5000,st+d);
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(.16,st+d); g.gain.linearRampToValueAtTime(0,st+d+.05);
    o.connect(f).connect(g).connect(out); o.start(st); o.stop(st+d+.1);
    const n=noiseSrc(ac), nf=filt(ac,"highpass",800), ng=ac.createGain(); ng.gain.setValueAtTime(0.0001,st); ng.gain.exponentialRampToValueAtTime(.12,st+d); ng.gain.linearRampToValueAtTime(0,st+d+.05);
    n.connect(nf).connect(ng).connect(out); n.start(st); n.stop(st+d+.1); },
  stinger(ac,out,t){ [98,138.6,207.7,293.7].forEach((fr,i)=>{ const o=osc(ac,i%2?"sawtooth":"square",fr), f=filt(ac,"lowpass",3000); f.frequency.setValueAtTime(3000,t); f.frequency.exponentialRampToValueAtTime(260,t+2);
    o.connect(f).connect(envG(ac,t,.01,.11,2.2)).connect(out); o.start(t); o.stop(t+2.4); }); FX.impact(ac,out,t); },
  rain(ac,out,t,dur){ const n=noiseSrc(ac); n.loop=true; const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(.13,t+.6); g.gain.setValueAtTime(.13,t+Math.max(.7,dur-.6)); g.gain.linearRampToValueAtTime(0.0001,t+dur);
    n.connect(filt(ac,"highpass",900)).connect(filt(ac,"lowpass",7000)).connect(g).connect(out); n.start(t); n.stop(t+dur); },
  bell(ac,out,t){ [1,2.76,5.4,8.93].forEach((m,i)=>{ const o=osc(ac,"sine",196*m); o.connect(envG(ac,t,.005,.26/(i+1),3.6-i*.6)).connect(out); o.start(t); o.stop(t+4); }); },
  glitch(ac,out,t){ const r=rand(Math.floor(t*1000)); for(let k=0;k<10;k++){ const at=t+k*.07+r()*.03, o=osc(ac,"square",200+r()*1800); o.connect(envG(ac,at,.002,.1,.05)).connect(out); o.start(at); o.stop(at+.09); } },
  drums(ac,out,t,dur,vol){ const v=vol||1, pat=[0,.45,.68,1.13,1.35]; for(let k=0;k<dur-.4;k+=1.8) pat.forEach((p,i)=>{ const at=t+k+p; if(at>t+dur-.2) return;
    const o=osc(ac,"sine",120); o.frequency.setValueAtTime(i%2?230:140,at); o.frequency.exponentialRampToValueAtTime(i%2?115:68,at+.2); o.connect(envG(ac,at,.005,(i%2?.32:.58)*v,.25)).connect(out); o.start(at); o.stop(at+.3); }); }
};
const BEDS={
  tense:{type:"sawtooth",f:[55,58.3],cut:320,g:.07,lfo:.15},
  dark:{type:"sine",f:[41.2,43.6,82.4],cut:420,g:.15,lfo:.07,noise:.035},
  warm:{type:"sine",f:[220,277.2,329.6,440],cut:2000,g:.045,lfo:.25},
  epic:{type:"sawtooth",f:[110,164.8,220,329.6],cut:900,g:.035,lfo:.1},
  synth:{type:"sawtooth",f:[55,110,164.8],cut:600,g:.05,lfo:.08},
  mystery:{type:"triangle",f:[196,233.1,293.7],cut:1200,g:.05,lfo:.2},
  pulse:{type:"square",f:[55,82.4],cut:500,g:.05,lfo:.1,gate:2},
  drums:{type:"sine",f:[73.4,110],cut:800,g:.07,lfo:.1,drums:true},
  bright:{type:"triangle",f:[261.6,329.6,392],cut:2500,g:.04,lfo:.3}

function bedSound(ac,out,kind,t,dur){
  const c=BEDS[kind]||BEDS.tense;
  const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(c.g,t+1.5); g.gain.setValueAtTime(c.g,t+dur-2); g.gain.linearRampToValueAtTime(0.0001,t+dur);
  const f=filt(ac,"lowpass",c.cut,4);
  const lfo=osc(ac,"sine",c.lfo), lg=ac.createGain(); lg.gain.value=c.cut*.4; lfo.connect(lg).connect(f.frequency); lfo.start(t); lfo.stop(t+dur);
  let node=f;
  if(c.gate){ const gate=ac.createGain(); gate.gain.value=.5; const go=osc(ac,"square",c.gate), gg=ac.createGain(); gg.gain.value=.5; go.connect(gg).connect(gate.gain); go.start(t); go.stop(t+dur); f.connect(gate); node=gate; }
  node.connect(g).connect(out);
  c.f.forEach((fr,i)=>{ const o=osc(ac,c.type,fr); o.detune.value=i%2?7:-7; o.connect(f); o.start(t); o.stop(t+dur); });
  if(c.noise){ const n=noiseSrc(ac); n.loop=true; const ng=ac.createGain(); ng.gain.value=c.noise; n.connect(ng).connect(f); n.start(t); n.stop(t+dur); }
  if(c.drums) FX.drums(ac,out,t+1,dur-2,.55);
}
function scheduleAudio(ac,out,s,ch,plan,t0){
  bedSound(ac,out,G(s.genre).bed,t0,plan.total);
  plan.segs.forEach(seg=>{ const t=t0+seg.t0;
    if(seg.kind==="title") FX.stinger(ac,out,t+.1);
    else if(seg.kind==="end"){ FX.riser(ac,out,t,seg.dur-.8); FX.impact(ac,out,t+seg.dur-.8); }
    else { const f=FX[seg.sc.sfx]; if(f) f(ac,out,t+.15,seg.dur-.15); } });
}

function stageCanvas(){ if(!tmp.stageCv){ const c=document.createElement("canvas"); c.width=VW; c.height=VH; c.setAttribute("aria-label","Video preview"); tmp.stageCv=c; } return tmp.stageCv; }
function setPlayMsg(m){ tmp.playMsg=m; const el=$("#playMsg"); if(el) el.textContent=m; }
function currentStory(){ const s=S.stories.series.find(x=>x.id===tmp.storyOpen); const ch=s&&s.chapters.find(c=>c.n===tmp.storyCh); return s&&ch?{s,ch}:null; }
function mountStage(){
  const box=$("#storyStage"); const cur=currentStory(); if(!box||!cur) return;
  const c=stageCanvas(); box.innerHTML=""; box.appendChild(c);
  if(!tmp.play){ const plan=videoPlan(cur.s,cur.ch); const imgs=cur.ch.scenes.map((_,i)=>{ const x=tmp.imgCache[imgKey(cur.s,cur.ch,i)]; return x&&x.img||null; });
    drawFrame(c.getContext("2d"),cur.s,cur.ch,plan,imgs,1.4); }
}
// H.264 MP4 uploads everywhere; WebM is the fallback (TikTok and YouTube accept it, Instagram may not)
function pickMime(){ return ["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4;codecs=avc1.42E01E,opus","video/mp4;codecs=avc1","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||""; }
async function saveBlob(blob,name){
  const dl=window.claude? await claude.use("downloads").catch(()=>null):null;
  if(dl){ await dl.save({filename:name,data:blob}); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),60000);
}
let playSeq=0;
async function playChapter(s,ch,record){
  if(record&&!(window.MediaRecorder&&HTMLCanvasElement.prototype.captureStream)){ toast("This browser can't export video. Use Chrome or Edge on a computer."); return; }
  const AC=window.AudioContext||window.webkitAudioContext;
  const id=++playSeq; tmp.play={id,stop:false,record}; render();
  setPlayMsg(S.stories.settings.images==="mood"?"Preparing…":"Painting scene pictures… (first time can take a minute)");
  try{ await Promise.all([document.fonts.load(`800 60px ${FONT_D}`),document.fonts.load(`500 36px ${FONT_B}`),document.fonts.load(`600 30px ${FONT_M}`)]); }catch(e){}
  const imgs=await loadChapterImages(s,ch,(d,n)=>setPlayMsg(`Pictures ${d} of ${n} ready…`));
  if(!tmp.play||tmp.play.id!==id) return;
  const missing=imgs.filter(x=>!x).length;
  const plan=videoPlan(s,ch), c=stageCanvas(), ctx=c.getContext("2d");
  const ac=new AC(); try{ await ac.resume(); }catch(e){}
  const master=ac.createGain(); master.gain.value=.9; const comp=ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
  let rec=null, chunks=[], mime="";
  if(record){
    const dest=ac.createMediaStreamDestination(); comp.connect(dest);
    const vs=c.captureStream(30); const stream=new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]);
    mime=pickMime(); rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:6e6}:undefined);
    rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  }
  const t0=ac.currentTime+.25; scheduleAudio(ac,master,s,ch,plan,t0);
  Object.assign(tmp.play,{ac,rec});
  if(rec) rec.start(500);
  const finished=await new Promise(resolve=>{
    const loop=()=>{ const p=tmp.play; if(!p||p.id!==id){ resolve(false); return; }
      const t=ac.currentTime-t0; drawFrame(ctx,s,ch,plan,imgs,Math.max(0,Math.min(t,plan.total-.001)));
      setPlayMsg(`${record?"Recording":"Playing"} ${secs(Math.max(0,t))} / ${secs(plan.total)}${record?" · keep this tab open and visible":""}${missing?` · ${missing} scene${missing>1?"s":""} using mood art`:""}`);
      if(p.stop){ resolve(false); return; } if(t>=plan.total){ resolve(true); return; }
      requestAnimationFrame(loop); };
    loop(); });
  if(rec){ const stopped=new Promise(r=>rec.onstop=r); try{ rec.stop(); }catch(e){} await stopped; }
  try{ await ac.close(); }catch(e){}
  if(tmp.play&&tmp.play.id===id) tmp.play=null;
  if(rec&&finished){
    const type=(mime.split(";")[0])||"video/webm"; const blob=new Blob(chunks,{type});
    const name=`${slug(s.title)}-part-${ch.n}.${type.includes("mp4")?"mp4":"webm"}`;
    try{ await saveBlob(blob,name); log(`Exported the video for ${s.title} Part ${ch.n} (${(blob.size/1048576).toFixed(1)} MB).`); setPlayMsg(`Saved ${name}`); toast("Video saved."); }
    catch(e){ setPlayMsg("Export cancelled."); }
  } else setPlayMsg(finished?"Preview finished.":"Stopped.");
  save(); render();
}

    <label class="f">Text<textarea name="text" style="min-height:300px" required>${esc(ch.text)}</textarea></label>
    <label class="f">Epic line<input type="text" name="epicLine" value="${esc(ch.epicLine)}"></label>
    <label class="f">Cliffhanger teaser<input type="text" name="cliffhanger" value="${esc(ch.cliffhanger)}"></label>
    <label class="check"><input type="checkbox" name="rebuild" checked> Rebuild the thread, captions and video scenes from the new text</label>
    ${dlgButtons("Save")}</form>`, fd=>{
      Object.assign(ch,{title:fd.title.trim(),text:fd.text.trim(),epicLine:fd.epicLine.trim(),cliffhanger:fd.cliffhanger.trim()});
      if(fd.rebuild){ rebuildChapter(s,ch); } else { refreshChapterPosts(s,ch); save(); render(); }
    }, true);
}
async function rebuildChapter(s,ch){
  tmp.busy["sw_"+s.id]=ch.n; render();
  let r=null; try{ r=await ai(adaptPrompt(s,ch),"default",{maxTokens:6000}); }catch(e){ toast(aiErrMsg(e)); }
  if(!r){ ch.scenes=[]; ch.thread=[]; }
  adaptChapter(s,ch,r); Object.keys(tmp.imgCache).filter(k=>k.startsWith(s.id+"|"+ch.n+"|")).forEach(k=>delete tmp.imgCache[k]);
  refreshChapterPosts(s,ch); tmp.busy["sw_"+s.id]=false; log(`Rebuilt the posts for ${s.title} Part ${ch.n}.`); save(); render();
}
function findCh(el){ const s=S.stories.series.find(x=>x.id===el.dataset.id); const ch=s&&s.chapters.find(c=>c.n===Number(el.dataset.n)); return {s,ch}; }
Object.assign(handlers,{
  "ns-create":async()=>{ const d=nsDraft();
    if(!d.platforms.length){ toast("Pick at least one platform to post to."); return; }
    const times=splitList(d.time).filter(x=>/^\d{1,2}:\d{2}$/.test(x)).map(x=>x.padStart(5,"0")); if(!times.length){ toast("Add a time like 19:00."); return; }
    while(times.length<d.perDay){ const h=(Number(times[times.length-1].split(":")[0])+5)%24; times.push(String(h).padStart(2,"0")+":00"); }
    const s=await createSeries({...d,times});
    if(s){ tmp.storyOpen=s.id; tmp.ns=null; toast(`“${s.title}” is ready.`); render(); window.scrollTo(0,0); }
    return "async"; },
  "story-open":(el)=>{ tmp.storyOpen=el.dataset.id; tmp.storyCh=null; window.scrollTo(0,0); },
  "story-back":()=>{ handlers["vid-stop"](); tmp.storyOpen=null; tmp.storyCh=null; },
  "story-pause":(el)=>{ const s=S.stories.series.find(x=>x.id===el.dataset.id); if(!s) return;
    if(s.status==="active"){ s.status="paused"; unscheduleSeries(s); log(`Paused ${s.title}. Unposted parts were taken off the schedule.`,"warn"); }
    else { s.status="active"; s.example=false; s.retryAt=0; const n=scheduleSeries(s); log(`Resumed ${s.title}.`); if(!n&&!s.platforms.some(k=>S.accounts[k].connected)) toast("Link one of this series' accounts so parts can be scheduled."); } },
  "story-settings":(el)=>{ const s=S.stories.series.find(x=>x.id===el.dataset.id); if(s) seriesSettingsDialog(s); },
  "story-del":(el)=>{ const s=S.stories.series.find(x=>x.id===el.dataset.id); if(!s) return;
    dialog(`<form><h2>Delete “${esc(s.title)}”?</h2><p class="sub">All ${s.chapters.length} written parts and any unposted scheduled posts will be removed. Posts already published stay in your history.</p>${dlgButtons("Delete series")}</form>`,()=>{
      handlers["vid-stop"](); S.posts=S.posts.filter(p=>!(p.seriesId===s.id&&p.status!=="posted")); S.stories.series=S.stories.series.filter(x=>x.id!==s.id);
      tmp.storyOpen=null; log(`Deleted the series ${s.title}.`,"warn"); save(); render(); }); },
  "story-write":(el)=>{ const s=S.stories.series.find(x=>x.id===el.dataset.id); if(s) writeNext(s,false); return "async"; },
  "ch-read":(el)=>{ const {s,ch}=findCh(el); if(!ch) return;
    dialog(`<h2>${esc(s.title)}: Part ${ch.n}</h2><div class="sub">${esc(ch.title)} · ${wordCount(ch.text).toLocaleString()} words</div><div class="reader">${esc(ch.text)}</div>
      <div class="toolbar" style="justify-content:flex-end"><button class="btn" data-close>Close</button></div>`,null,true); return "noop"; },
  "ch-edit":(el)=>{ const {s,ch}=findCh(el); if(ch) chapterEditDialog(s,ch); return "noop"; },
  "ch-rewrite":(el)=>{ const {s,ch}=findCh(el); if(!ch) return;
    s.storySoFar=ch.prevSoFar||s.storySoFar; S.posts=S.posts.filter(p=>!(p.seriesId===s.id&&p.chapter===ch.n&&p.status!=="posted"));
    s.chapters=s.chapters.filter(c=>c.n!==ch.n); if(s.scheduled>=ch.n) s.scheduled=ch.n-1; if(tmp.storyCh===ch.n) tmp.storyCh=null;
    writeNext(s,false); return "async"; },
  "ch-video":(el)=>{ handlers["vid-stop"](); tmp.storyCh=Number(el.dataset.n); tmp.playMsg=""; render(); const v=$("#videoPanel"); if(v) v.scrollIntoView({behavior:"smooth",block:"start"}); return "noop"; },
  "vid-close":()=>{ handlers["vid-stop"](); tmp.storyCh=null; },
  "vid-play":()=>{ const c=currentStory(); if(c) playChapter(c.s,c.ch,false); return "async"; },
  "vid-export":()=>{ const c=currentStory(); if(c) playChapter(c.s,c.ch,true); return "async"; },
  "vid-stop":()=>{ if(tmp.play) tmp.play.stop=true; }
});
// story form fields (kept in tmp so the form survives re-renders)
document.addEventListener("input",e=>{ const t=e.target;
  if(t.dataset.ns && t.tagName!=="SELECT"){ nsDraft()[t.dataset.ns]=t.value; }
  if(t.dataset.scenetxt!=null){ const c=currentStory(); if(c){ c.ch.scenes[Number(t.dataset.scenetxt)].onScreen=t.value.slice(0,160); save(); } }
});
document.addEventListener("change",e=>{ const t=e.target;
  if(t.dataset.ns && t.tagName==="SELECT"){ const k=t.dataset.ns; nsDraft()[k]=(k==="total"||k==="perDay")?Number(t.value):t.value; return; }
  if(t.dataset.nsplat){ const a=nsDraft().platforms, k=t.dataset.nsplat; if(t.checked){ if(!a.includes(k)) a.push(k); } else a.splice(a.indexOf(k),1); return; }
  if(t.dataset.sset){ const k=t.dataset.sset, set=S.stories.settings; set[k]=t.type==="checkbox"?t.checked:(k==="ahead"?Number(t.value):t.value);
    if(k==="exclusive") log(t.checked?"Story accounts now post only their story.":"Story accounts post regular posts too."); save(); render(); return; }
  if(t.dataset.rot){ const r=S.stories.settings.rotate, k=t.dataset.rot; if(t.checked){ if(!r.includes(k)) r.push(k); } else r.splice(r.indexOf(k),1); save(); return; }
  if(t.dataset.scenefx!=null){ const c=currentStory(); if(c){ c.ch.scenes[Number(t.dataset.scenefx)].sfx=t.value; save(); } return; }
  if(t.dataset.sceneup!=null && t.files&&t.files[0]){ const c=currentStory(); if(!c) return; const i=Number(t.dataset.sceneup);
    const url=URL.createObjectURL(t.files[0]); loadImg(url,15000).then(im=>{ if(!im){ toast("Couldn't open that picture."); return; } tmp.imgCache[imgKey(c.s,c.ch,i)]={img:im,mine:true}; render(); toast(`Picture added to scene ${i+1}. It stays until you reload the page.`); }); }
});

/* ---------------- events ---------------- */
document.addEventListener("click",async e=>{
  const go=e.target.closest("[data-go]"); if(go){ view=go.dataset.go; render(); window.scrollTo(0,0); return; }
  const el=e.target.closest("[data-act]"); if(!el||el.tagName==="INPUT") return;
  const fn=handlers[el.dataset.act]; if(!fn) return;
  const r=fn(el); if(r==="async"||r==="noop"||r instanceof Promise) return;
  save(); render();
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="vidFile" && t.files[0]){ const f=t.files[0]; if(tmp.video) URL.revokeObjectURL(tmp.video.url);
    tmp.video={name:f.name,url:URL.createObjectURL(f),el:null}; tmp.mark={in:null,out:null}; render(); return; }
  if(t.dataset.act==="toggle-approval"){ S.approval=t.checked; save(); return; }
  if(t.dataset.perm){ const s=S.clips.sources.find(x=>x.id===t.dataset.perm); if(s){ s.permission=t.value; save(); render(); } return; }
  if(t.dataset.clipplat){ const k=t.dataset.clipplat, a=S.clips.platforms; t.checked?a.includes(k)||a.push(k):a.splice(a.indexOf(k),1); save(); return; }
  if(t.dataset.clipset){ const k=t.dataset.clipset; S.clips[k]=k==="times"?splitList(t.value).filter(x=>/^\d{1,2}:\d{2}$/.test(x)).map(x=>x.padStart(5,"0")):Number(t.value); save(); return; }
  if(t.dataset.acc){ const a=S.accounts[t.dataset.acc];
    if(t.dataset.field==="times"){ const ts=splitList(t.value).filter(x=>/^\d{1,2}:\d{2}$/.test(x)).map(x=>x.padStart(5,"0")); if(ts.length){ a.times=ts; a.perDay=Math.min(a.perDay,ts.length)||1; } }
    else { a.perDay=Number(t.value); while(a.times.length<a.perDay){ const last=a.times[a.times.length-1]||"09:00"; const h=(Number(last.split(":")[0])+3)%24; a.times.push(String(h).padStart(2,"0")+":00"); } }
    save(); render(); return; }
  if(t.dataset.limit){ const k=t.dataset.limit; const v=Math.max(0,Math.min(SAFE[k],Number(t.value)||0)); if(Number(t.value)>SAFE[k]) toast(`Capped at ${SAFE[k]} a day to keep your account safe.`); S.growth.limits[k]=v; save(); render(); return; }
  if(t.dataset.crit==="requireBio"){ S.growth.criteria.requireBio=t.checked; save(); render(); return; }
  if(t.dataset.brief==="language"||t.dataset.brief==="days"){ S.brief[t.dataset.brief]=t.value; save(); render(); return; }
  if(t.dataset.insp==="platform"){ tmp.inspireDraft.platform=t.value; return; }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.brief){ const k=t.dataset.brief; S.brief[k]=k==="topics"?t.value.split("\n").map(x=>x.trim()).filter(Boolean):t.value; save(); }
  if(t.dataset.crit && t.dataset.crit!=="requireBio"){ S.growth.criteria[t.dataset.crit]=t.value; save(); }
  if(t.dataset.insp){ tmp.inspireDraft[t.dataset.insp]=t.value; }
});
document.addEventListener("focusout",e=>{ if(e.target.dataset.crit && view==="growth") render(); });

render(); railFoot();
setInterval(tick, 15000);
setTimeout(tick, 2000);
</script>
